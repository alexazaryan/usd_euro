name: check-rate
on:
   schedule:
      - cron: "0 9 * * *"
      - cron: "0 10 * * *"
   workflow_dispatch:
jobs:
   run:
      runs-on: ubuntu-latest
      steps:
         - uses: actions/checkout@v4
         - uses: actions/setup-node@v4
           with:
              node-version: 20
         - run: node check.js
           env:
              TG_TOKEN: ${{ secrets.TG_TOKEN }}
